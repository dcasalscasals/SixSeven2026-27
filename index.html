<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101612" />
    <meta name="description" content="Resultados, próximos partidos y clasificación de SIX SEVEN en la liga FPIB de Menorca." />
    <title>SIX SEVEN — Liga FPIB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{color-scheme:dark;--bg:#101612;--panel:#181f1a;--panel2:#202922;--line:#303a32;--text:#f1f4ed;--muted:#9aa69a;--lime:#c3f36b;--red:#ff8b78;--mono:'DM Mono',monospace;--sans:Manrope,system-ui,sans-serif}
      *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:34px 32px 52px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand-logo{width:104px;height:104px;object-fit:contain;display:block}.season,.eyebrow,.mono{font:11px var(--mono);letter-spacing:.07em;color:var(--muted)}.hero{padding:48px 0 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{color:var(--lime);text-transform:uppercase}.hero h1{font-size:clamp(40px,8vw,76px);line-height:.96;letter-spacing:-.07em;margin:14px 0 12px}.hero p{color:var(--muted);margin:0;font-size:14px}.refresh{border:1px solid var(--line);background:transparent;color:var(--text);padding:11px 15px;border-radius:9px;font:12px var(--sans);cursor:pointer}.refresh:hover{border-color:var(--lime);color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card h2{font-size:15px;margin:0}.pill{font:10px var(--mono);color:var(--lime);border:1px solid #52663a;border-radius:20px;padding:6px 9px}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--panel2);border-radius:10px;padding:13px 12px}.stat b{font-size:25px;letter-spacing:-.05em;display:block}.stat span{font:9px var(--mono);color:var(--muted);text-transform:uppercase}.rank{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.rank strong{font-size:24px;letter-spacing:-.05em}.rank small{color:var(--muted);font-size:12px}.matches{grid-column:1/-1}.matchlist{display:grid;gap:9px}.match{background:var(--panel2);border-radius:10px;padding:15px 16px;display:grid;grid-template-columns:70px 1fr 120px;align-items:center;gap:12px}.round{font:10px var(--mono);color:var(--muted);text-transform:uppercase}.teams{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:700}.teams .vs{color:var(--muted);font:10px var(--mono)}.teams .mine{color:var(--lime)}.score{font:14px var(--mono);text-align:right}.score.pending{color:var(--muted);font-size:11px}.match-meta{grid-column:2/4;color:var(--muted);font:10px var(--mono);margin-top:-5px}.tablecard{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px}th{text-align:right;color:var(--muted);font:9px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 10px 12px}td{text-align:right;padding:12px 10px;border-top:1px solid var(--line);font:12px var(--mono);color:#c6cec2}th:nth-child(2),td:nth-child(2){text-align:left}td:first-child{color:var(--muted)}td:nth-child(2){font:600 12px var(--sans);color:var(--text)}tr.mine td{color:var(--lime);background:rgba(195,243,107,.045)}tr.mine td:first-child{border-radius:8px 0 0 8px}tr.mine td:last-child{border-radius:0 8px 8px 0}.foot{display:flex;justify-content:space-between;margin-top:20px;color:var(--muted);font:10px var(--mono)}.foot a{text-decoration:none;color:var(--lime)}.loading,.error{grid-column:1/-1;color:var(--muted);padding:35px 20px;text-align:center;border:1px dashed var(--line);border-radius:14px;font-size:13px}.error{color:var(--red)}
      @media(max-width:700px){.wrap{padding:22px 16px 36px}.hero{padding:38px 0 25px;align-items:flex-start}.hero h1{font-size:52px}.grid{grid-template-columns:1fr}.matches,.tablecard{grid-column:auto}.match{grid-template-columns:55px 1fr}.score{grid-column:2;text-align:left}.match-meta{grid-column:2}.card{padding:18px}.foot{gap:14px;flex-wrap:wrap}}
      @media(max-width:390px){.statrow{grid-template-columns:repeat(2,1fr)}.teams{font-size:11px;gap:7px}}
      .rounds{display:grid;gap:12px}.round-block{border:1px solid var(--line);border-radius:11px;background:var(--panel2);overflow:hidden}.round-title{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;cursor:pointer;list-style:none;font-size:12px;font-weight:700}.round-title::-webkit-details-marker{display:none}.round-title span{color:var(--muted);font:10px var(--mono)}.round-content{padding:0 12px 12px;display:grid;gap:8px}.fixture{border:1px solid var(--line);border-radius:9px;padding:12px}.fixture-mine{border-color:#708d45;background:linear-gradient(100deg,rgba(195,243,107,.12),rgba(195,243,107,.025));box-shadow:inset 3px 0 0 var(--lime)}.fixture-mine .fixture-score{color:var(--lime);font-weight:500}.fixture-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:12px;font-weight:700}.fixture-top>span:last-child{text-align:right}.fixture-score{font:13px var(--mono);color:var(--lime)}.fixture-meta{color:var(--muted);font:9px var(--mono);margin-top:7px}.mine-tag{color:var(--lime);font-weight:500}.pair-lines{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;display:grid;gap:7px}.pair-line{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:10px;color:#c6cec2}.pair-line>span:last-child{text-align:right}.pair-line .setline{font:9px var(--mono);color:var(--muted);white-space:nowrap}.pair-line .pairwinner,.pair-line .my-side{color:var(--lime)}.pair-line .pairwinner{font-weight:700}.stats-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats-grid .card{min-width:0}.stats-grid .card:last-child{grid-column:1/-1}.stats-table td:nth-child(2){text-align:left}.empty-note{color:var(--muted);font-size:12px;padding:8px 0}@media(max-width:700px){.stats-grid{grid-template-columns:1fr}.stats-grid .card:last-child{grid-column:auto}.fixture-top{font-size:10px}.pair-line{font-size:9px}.brand-logo{width:82px;height:82px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top"><img class="brand-logo" src="/assets/six-seven-logo.png" alt="SIX SEVEN Padel Team · LaLiga 26/27" /><div class="season">MENORCA / 26—27</div></header>
      <section class="hero"><div><div class="eyebrow">Seguimiento de equipo</div><h1>SIX<br/>SEVEN<span style="color:var(--lime)">.</span></h1><p>División Azul Masculina</p></div><button class="refresh" id="refresh">↻ &nbsp;Actualizar datos</button></section>
      <section class="grid" id="dashboard"><div class="loading">Consultando clasificación y calendario…</div></section>
      <footer class="foot"><span id="updated">Datos oficiales de la Federación</span><a href="https://www.padelfederacion.es/Paginas/fpadelib/Ligas_Clasificacion.asp?Liga=28876&amp;grupo=32942" target="_blank" rel="noreferrer">Ver fuente oficial ↗</a></footer>
    </main>
    <script>
      const dashboard = document.querySelector('#dashboard');
      const fmtDate = value => { if (!value) return ''; const [d,m,y] = value.split('/'); return `${d}.${m}.${y}`; };
      const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const keyFor = (fixture) => `${fixture.round}-${fixture.id}`;
      function makeStats(details) {
        const pairs = new Map(), players = new Map();
        for (const fixture of details) for (const pair of fixture.pairings || []) {
          for (const side of ['home','away']) {
            const names = pair[`${side}Players`] || [];
            if (names.length < 2) continue;
            const team = fixture[`${side}Id`], teamName = fixture[side];
            const sorted = [...names].sort((a,b)=>a.localeCompare(b,'es'));
            const key = `${team}:${sorted.map(n=>n.toLocaleUpperCase('es')).join('|')}`;
            if (!pairs.has(key)) pairs.set(key,{team:teamName,players:sorted,count:0,wins:0,losses:0,setsWon:0,setsLost:0});
            const stat=pairs.get(key); stat.count++; stat.setsWon+=pair[`${side}Sets`]; stat.setsLost+=pair[side==='home'?'awaySets':'homeSets'];
            if(pair.winner===side)stat.wins++; else if(pair.winner)stat.losses++;
            for(const name of names){const pkey=`${team}:${name.toLocaleUpperCase('es')}`;if(!players.has(pkey))players.set(pkey,{name,team:teamName,teamId:team,played:0,wins:0,losses:0,setsWon:0,setsLost:0});const player=players.get(pkey);player.played++;player.setsWon+=pair[`${side}Sets`];player.setsLost+=pair[side==='home'?'awaySets':'homeSets'];if(pair.winner===side)player.wins++;else if(pair.winner)player.losses++;}
          }
        }
        return {pairs:[...pairs.values()].filter(p=>p.count>1).sort((a,b)=>b.count-a.count||b.wins-a.wins),players:[...players.values()].sort((a,b)=>b.wins-a.wins||b.played-a.played)};
      }
      function render(data) {
        const standing = data.teamStanding;
        const matches = data.matches || [], details = data.details || [];
        const detailMap = new Map(details.map(d=>[keyFor(d),d]));
        const upcoming = matches.filter(m=>!m.played).sort((a,b)=>a.round-b.round);
        const teamCard = standing ? `<article class="card"><div class="card-head"><h2>Tu temporada</h2><span class="pill">${standing.position}º EN LA TABLA</span></div><div class="statrow"><div class="stat"><b>${standing.points}</b><span>Puntos</span></div><div class="stat"><b>${standing.wins}–${standing.losses}</b><span>Jornadas</span></div><div class="stat"><b>${standing.matchesWon}–${standing.matchesLost}</b><span>Partidos</span></div><div class="stat"><b>${standing.setsWon}–${standing.setsLost}</b><span>Sets</span></div></div><div class="rank"><strong>${standing.played}<small> jornadas jugadas</small></strong><small>${upcoming.length ? `${upcoming.length} partidos pendientes` : 'Calendario al día'}</small></div></article>` : `<article class="card"><h2>Datos del equipo no disponibles</h2></article>`;
        const nextMatch = upcoming[0];
        const nextCard = nextMatch ? `<article class="card"><div class="card-head"><h2>Próximo partido</h2><span class="pill">JORNADA ${nextMatch.round}</span></div><div class="teams"><span class="${nextMatch.homeId === '161338' ? 'mine' : ''}">${safe(nextMatch.home)}</span><span class="vs">VS</span><span class="${nextMatch.awayId === '161338' ? 'mine' : ''}">${safe(nextMatch.away)}</span></div><div class="rank"><strong style="font-size:17px">${safe(fmtDate(nextMatch.date) || 'Fecha por confirmar')}</strong><small>${safe(nextMatch.time || '')}${nextMatch.venue ? ` · ${safe(nextMatch.venue)}` : ''}</small></div></article>` : `<article class="card"><div class="card-head"><h2>Próximo partido</h2></div><p style="color:var(--muted);font-size:13px">No hay partidos pendientes publicados.</p></article>`;
        const rounds = Array.from({length:data.rounds||1},(_,i)=>i+1);
        const roundCards=rounds.map(round=>{const fixtures=matches.filter(m=>m.round===round);const played=fixtures.filter(m=>m.played).length;const cards=fixtures.map(m=>{const detail=detailMap.get(keyFor(m));const myHome=m.homeId==='161338';const isMine=myHome||m.awayId==='161338';const pairLines=(detail?.pairings||[]).map(p=>`<div class="pair-line"><span class="${p.winner==='home'?'pairwinner':''} ${myHome?'my-side':''}">${safe(p.homePlayers.join(' / '))}</span><span class="setline">${p.setScores.map(s=>`${s[0]}–${s[1]}`).join(' · ')||'Sin acta'}</span><span class="${p.winner==='away'?'pairwinner':''} ${myHome?'':'my-side'}">${safe(p.awayPlayers.join(' / '))}</span></div>`).join('');return `<article class="fixture ${isMine?'fixture-mine':''}"><div class="fixture-top"><span class="${myHome?'mine':''}">${safe(m.home)}</span><span class="fixture-score">${m.played?`${safe(m.homeScore)}–${safe(m.awayScore)}`:'VS'}</span><span class="${myHome?'':'mine'}">${safe(m.away)}</span></div><div class="fixture-meta">${m.played?'FINALIZADO':'PENDIENTE'}${isMine?' <span class="mine-tag">· SIX SEVEN</span>':''}${m.date?` · ${fmtDate(m.date)}`:''}${m.time?` · ${safe(m.time)}`:''}${m.venue?` · ${safe(m.venue)}`:''}</div>${pairLines?`<div class="pair-lines">${pairLines}</div>`:''}</article>`;}).join('');return `<details class="round-block" ${round===Math.max(1,...matches.filter(m=>m.played).map(m=>m.round))?'open':''}><summary class="round-title">Jornada ${round}<span>${played}/${fixtures.length} enfrentamientos disputados</span></summary><div class="round-content">${cards||'<div class="empty-note">Calendario todavía no publicado.</div>'}</div></details>`;}).join('');
        const aggregate=makeStats(details);
        const repeatedPairs=aggregate.pairs.length?aggregate.pairs.map(p=>`<tr><td>${safe(p.team)}</td><td>${safe(p.players.join(' / '))}</td><td>${p.count}</td><td>${p.wins}–${p.losses}</td><td>${p.setsWon}–${p.setsLost}</td></tr>`).join(''):'<tr><td colspan="5" class="empty-note">Aún no hay parejas que hayan jugado juntas más de una vez.</td></tr>';
        const playerRows=aggregate.players.slice(0,15).map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.team)}</td><td>${p.played}</td><td>${p.wins}–${p.losses}</td><td>${p.setsWon}–${p.setsLost}</td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">Las estadísticas aparecerán cuando se publiquen actas.</td></tr>';
        const teamPlayerRows=aggregate.players.filter(p=>p.teamId==='161338').slice(0,15).map(p=>`<tr class="mine"><td>${safe(p.name)}</td><td>${p.played}</td><td>${p.wins}–${p.losses}</td><td>${p.setsWon}–${p.setsLost}</td></tr>`).join('')||'<tr><td colspan="4" class="empty-note">Las estadísticas de SIX SEVEN aparecerán cuando se publiquen sus actas.</td></tr>';
        const tableRows=(data.standings||[]).map(t=>`<tr class="${t.teamId==='161338'?'mine':''}"><td>${t.position}</td><td>${safe(t.team)}</td><td>${t.played}</td><td>${t.points}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.matchesWon}</td><td>${t.matchesLost}</td></tr>`).join('');
        dashboard.innerHTML=`${teamCard}${nextCard}<article class="card matches"><div class="card-head"><div><h2>Resultados de toda la liga</h2><div class="fixture-meta">Cada enfrentamiento suma tres partidos de parejas; cada partido se juega al mejor de tres sets.</div></div><span class="eyebrow">${matches.length} ENFRENTAMIENTOS</span></div><div class="rounds">${roundCards}</div></article><article class="card tablecard"><div class="card-head"><h2>Clasificación</h2><span class="pill">DIVISIÓN AZUL MASCULINA</span></div><div class="tablewrap"><table><thead><tr><th>Pos</th><th>Equipo</th><th>JJ</th><th>Pts</th><th>JG</th><th>JP</th><th>PG</th><th>PP</th></tr></thead><tbody>${tableRows}</tbody></table></div></article><section class="stats-grid"><article class="card"><div class="card-head"><h2>Parejas que se repiten</h2><span class="pill">POR EQUIPO</span></div><div class="tablewrap"><table class="stats-table"><thead><tr><th>Equipo</th><th>Pareja</th><th>Veces</th><th>Vict./derrotas</th><th>Sets</th></tr></thead><tbody>${repeatedPairs}</tbody></table></div></article><article class="card"><div class="card-head"><h2>Top jugadores de la liga</h2><span class="pill">TOP 15</span></div><div class="fixture-meta">Ordenados por partidos de parejas ganados.</div><div class="tablewrap"><table class="stats-table"><thead><tr><th>Jugador</th><th>Equipo</th><th>Part.</th><th>Vict./derrotas</th><th>Sets</th></tr></thead><tbody>${playerRows}</tbody></table></div></article><article class="card"><div class="card-head"><h2>Top jugadores SIX SEVEN</h2><span class="pill">TOP 15</span></div><div class="fixture-meta">Ordenados por partidos de parejas ganados.</div><div class="tablewrap"><table class="stats-table"><thead><tr><th>Jugador</th><th>Part.</th><th>Vict./derrotas</th><th>Sets</th></tr></thead><tbody>${teamPlayerRows}</tbody></table></div></article></section>`;
        const date=new Date(data.updatedAt); document.querySelector('#updated').textContent=`Actualizado ${date.toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})} · Fuente: Federación`;
      }
      async function load(){dashboard.innerHTML='<div class="loading">Consultando clasificación y calendario…</div>';document.querySelector('#refresh').disabled=true;try{const res=await fetch('/api/data');const data=await res.json();if(!res.ok)throw new Error(data.error||'Error al cargar los datos.');render(data);}catch(e){dashboard.innerHTML=`<div class="error">${safe(e.message)}<br/><span style="font-size:11px">Prueba a actualizar en unos segundos.</span></div>`;}finally{document.querySelector('#refresh').disabled=false;}}
      document.querySelector('#refresh').addEventListener('click',load);load();
    </script>
  </body>
</html>
